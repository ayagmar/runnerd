[package]
name = "runnerd"
description = "Runs ephemeral GitHub Actions runners in containers within a host budget"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords = ["github-actions", "ci", "runner", "docker", "sysbox"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
axum.workspace = true
clap.workspace = true
futures-util.workspace = true
hyper.workspace = true
hyper-util = { workspace = true, features = ["tokio"] }
reqwest.workspace = true
runnerd-core = { workspace = true, features = ["host"] }
runnerd-web.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
# To make the job history fail a write, as a full disk would.
rusqlite.workspace = true

# cargo binstall downloads the release archive dist builds (named for the crate; the binary sits in a directory of the
# same name) instead of compiling. Releases cover Linux x86_64 and aarch64 on musl.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }{ archive-suffix }"
bin-dir = "{ name }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "txz"

[lints]
workspace = true
