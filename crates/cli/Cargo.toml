[package]
name = "runnerctl"
description = "Command-line client for the runnerd daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
clap.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["client", "http1"] }
hyper-util = { workspace = true, features = ["tokio"] }
ratatui = { workspace = true, optional = true }
runnerd-core.workspace = true
rustix = { workspace = true, features = ["process"], optional = true }
serde.workspace = true
serde_json.workspace = true
serde_urlencoded.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt", "sync", "time"] }

[features]
default = ["tui"]
# `runnerctl tui`, the full-screen terminal dashboard.
tui = ["dep:ratatui", "dep:rustix", "tokio/signal"]

[dev-dependencies]
axum.workspace = true
futures-util.workspace = true
rustix = { workspace = true, features = ["fs", "process", "pty", "termios"] }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "time"] }

[lints]
workspace = true
