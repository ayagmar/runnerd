[package]
name = "runnerd-web"
description = "The web dashboard runnerd serves on loopback: a client of the daemon's API"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# The vendored font is under the SIL Open Font License (assets/fonts/OFL.txt).
license = "MIT AND OFL-1.1"
repository.workspace = true
readme.workspace = true
keywords = ["github-actions", "ci", "runner", "dashboard"]
categories = ["development-tools", "web-programming"]

[dependencies]
axum.workspace = true
datastar = { version = "0.4.1", features = ["axum"] }
futures-util.workspace = true
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["client", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
maud = { version = "0.27.0", features = ["axum"] }
runnerd-core.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_urlencoded = "0.7.1"
tokio = { workspace = true, features = ["fs", "macros", "net", "rt", "sync", "time"] }
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "time"] }

[lints]
workspace = true
