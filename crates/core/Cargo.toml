[package]
name = "runnerd-core"
description = "Config, domain logic and API types shared by runnerd and its clients"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["host"]
# What only the daemon runs: Docker, the GitHub client, the caches and the scheduler. Clients turn it off and get
# `api` and `config` alone.
host = [
  "dep:bollard",
  "dep:futures-util",
  "dep:reqwest",
  "dep:rustls",
  "dep:serde_json",
  "dep:tar",
  "dep:tokio",
  "dep:tracing",
]

[dependencies]
bollard = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
serde.workspace = true
serde_json = { workspace = true, optional = true }
tar = { workspace = true, optional = true }
thiserror.workspace = true
tokio = { workspace = true, optional = true, features = ["macros", "rt", "sync", "time"] }
toml.workspace = true
tracing = { workspace = true, optional = true }

[dev-dependencies]
axum.workspace = true
log.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }

# They start real containers through the host modules.
[[test]]
name = "docker_smoke"
required-features = ["host"]

[[test]]
name = "cache_reseed"
required-features = ["host"]

[lints]
workspace = true
