# Publishes a GitHub release when a version tag (v0.0.1, v0.0.1-rc.1) is pushed. A tag with a suffix makes a
# pre-release.
#
# Derived from the workflow dist 0.33.1 generates (`dist generate --mode ci`), then edited, so Cargo.toml sets
# `allow-dirty = ["ci"]` and dist does not regenerate it. Changes from dist's version:
# - write permissions only on the jobs that need them, instead of contents: write for the whole workflow;
# - dist downloaded from a pinned release with its SHA-256 checked (.github/scripts/install-dist.sh), not curl | sh;
# - expressions passed to run: blocks through env, so zizmor finds no template injection;
# - Linux only: no Windows or container steps, no PR runs;
# - install.sh is published with the release's tag as its default version.
# - a release tag without a suffix fails unless its commit is on main.
# To pick up a newer dist, regenerate into a scratch copy and carry its changes over by hand.

name: release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: read

jobs:
  # Works out what to build for this tag.
  plan:
    name: plan
    runs-on: ubuntu-24.04
    outputs:
      val: ${{ steps.plan.outputs.manifest }}
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the main check below needs main's history
      # A release (a tag without a suffix) must be a commit on main; pre-releases may come from any commit.
      - name: Check the release commit is on main
        if: ${{ !contains(github.ref_name, '-') }}
        run: |
          git merge-base --is-ancestor HEAD origin/main \
            || { echo "::error::$TAG is not on main; tag a commit from main"; exit 1; }
      - run: .github/scripts/install-dist.sh
      - id: plan
        run: |
          dist host --steps=create --tag="$TAG" --output-format=json > plan-dist-manifest.json
          cat plan-dist-manifest.json
          echo "manifest=$(jq -c . plan-dist-manifest.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: artifacts-plan-dist-manifest
          path: plan-dist-manifest.json

  # Builds one archive per app on each target's native runner, and attests them.
  build-local-artifacts:
    name: build (${{ join(matrix.targets, ', ') }})
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write # attest signs with the run's OIDC identity
      attestations: write # attest stores the attestation
    env:
      TAG: ${{ github.ref_name }}
      TARGET: ${{ matrix.targets[0] }}
      BUILD_MANIFEST_NAME: target/distrib/${{ join(matrix.targets, '-') }}-dist-manifest.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: .github/scripts/install-dist.sh
      - run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - name: Build
        run: dist build --tag="$TAG" --print=linkage --output-format=json --artifacts=local --target="$TARGET" > dist-manifest.json
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: target/distrib/*${{ matrix.targets[0] }}*
      - id: cargo-dist
        name: List files to upload
        run: |
          {
            echo "paths<<EOF"
            dist print-upload-files-from-manifest --manifest dist-manifest.json
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: artifacts-build-local-${{ join(matrix.targets, '_') }}
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}

  # The checksum file over every archive, the source tarball, and install.sh; attests those three files.
  build-global-artifacts:
    name: build (global)
    needs: [plan, build-local-artifacts]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # attest signs with the run's OIDC identity
      attestations: write # attest stores the attestation
    env:
      TAG: ${{ github.ref_name }}
      BUILD_MANIFEST_NAME: target/distrib/global-dist-manifest.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: .github/scripts/install-dist.sh
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - id: cargo-dist
        run: |
          dist build --tag="$TAG" --output-format=json --artifacts=global > dist-manifest.json
          # The published install.sh installs this release unless told otherwise.
          sed "s/:-latest}/:-$TAG}/" install.sh > target/distrib/install.sh
          grep -qF ":-$TAG}" target/distrib/install.sh
          {
            echo "paths<<EOF"
            jq -r '.upload_files[]' dist-manifest.json
            echo target/distrib/install.sh
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            target/distrib/install.sh
            target/distrib/sha256.sum
            target/distrib/source.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: artifacts-build-global
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}

  # Creates the GitHub release with every artifact attached.
  host:
    name: release
    needs: [plan, build-local-artifacts, build-global-artifacts]
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the release and upload its assets
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: .github/scripts/install-dist.sh
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - id: host
        run: |
          dist host --tag="$TAG" --steps=upload --steps=release --output-format=json > dist-manifest.json
          cat dist-manifest.json
          echo "manifest=$(jq -c . dist-manifest.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: artifacts-*
          path: artifacts
          merge-multiple: true
      - name: Create GitHub release
        env:
          PRERELEASE: ${{ fromJson(steps.host.outputs.manifest).announcement_is_prerelease }}
          TITLE: ${{ fromJson(steps.host.outputs.manifest).announcement_title }}
          BODY: ${{ fromJson(steps.host.outputs.manifest).announcement_github_body }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          rm -f artifacts/*-dist-manifest.json
          echo "$BODY" > "$RUNNER_TEMP/notes.txt"
          flags=()
          [ "$PRERELEASE" != true ] || flags+=(--prerelease)
          gh release create "$TAG" --target "$RELEASE_COMMIT" "${flags[@]}" --title "$TITLE" --notes-file "$RUNNER_TEMP/notes.txt" artifacts/*
