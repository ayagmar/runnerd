# An example: two repositories with two runners each, inside runnerd.slice (MemoryMax=33G).
# 2 × 9G + 2 × 7G + 512M for the mirror = 32.5G.

[host]
slice = "runnerd.slice"
isolation = "sysbox"

[caches]
mirror = { enabled = true, memory = "512M", cpus = 1, ttl = "168h", max_size = "10G" }
pnpm = { max_size = "5G" }
maven = { max_size = "5G" }
# Slot 1's layers become a profile's snapshot once they changed this much and the profile is idle.
reseed_at = "2G"
# A reseed that would make a snapshot larger than this starts it over from slot 1's changes.
snapshot_max = "10G"
# The build cache every runner shares, written by pushes to each repository's default branch (the default). It also
# serves GitHub Actions' cache in place of GitHub's; actions_cache = false leaves jobs on GitHub's.
build = { max_size = "10G" }

# Job history, with its defaults: where it lives and how long samples, logs and events are kept.
[history]
# database = "/srv/runnerd/runnerd.db"   # default: $XDG_STATE_HOME/runnerd/runnerd.db
samples = "168h"
logs = "720h"
events = "720h"
jobs = "2160h"
log_max = "50M"

# Each profile runs one stage of image/Dockerfile. `image` is the stage as the release publishes it,
# pulled before the first runner; keep its version at the daemon's. `image_stage = "jvm"` runs `runnerd-runner:jvm` instead, built
# on this host from a clone: docker build --target jvm -t runnerd-runner:jvm image

# Gradle, Android, Quarkus and Testcontainers PostgreSQL; a busy runner peaked at 6.8G without page cache.
[profiles.jvm]
image = "ghcr.io/ayagmar/runnerd-runner:jvm-0.0.27"
cpus = 8
memory = "9G"
slots = 2

# Maven, pnpm, Next.js image builds, Testcontainers, Playwright, Flutter; a busy runner peaked at 6.0G.
[profiles.node]
image = "ghcr.io/ayagmar/runnerd-runner:node-0.0.27"
cpus = 8
memory = "7G"
slots = 2

[[repositories]]
name = "halyard/ledger"
profile = "jvm"
labels = ["self-hosted", "linux", "x64", "jvm"]

[[repositories]]
name = "halyard/storefront"
profile = "node"
labels = ["self-hosted", "linux", "x64", "node"]

# Failures, lost jobs, runners that cannot start and new insights, to a phone through ntfy. Off without a target.
