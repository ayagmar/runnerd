# The owner's setup: two repositories with two runners each, inside ci.slice (MemoryMax=33G).
# 2 × 9G + 2 × 7G + 512M for the mirror = 32.5G.

[host]
slice = "ci.slice"
isolation = "sysbox"

[caches]
mirror = { enabled = true, memory = "512M", cpus = 1, ttl = "168h" }
pnpm = { max_size = "5G" }
maven = { max_size = "5G" }
# Slot 1's layers become a profile's snapshot once they changed this much and the profile is idle.
reseed_at = "2G"

# Job history, with its defaults: where it lives and how long samples, logs and events are kept.
[history]
# database = "/srv/runnerd/runnerd.db"   # default: $XDG_STATE_HOME/runnerd/runnerd.db
samples = "168h"
logs = "720h"
events = "720h"
log_max = "50M"

# Gradle, Android, Quarkus and Testcontainers PostgreSQL; a busy runner peaked at 6.8G without page cache.
[profiles.trellis]
image_stage = "trellis"
cpus = 8
memory = "9G"
slots = 2

# Maven, pnpm, Next.js image builds, Testcontainers, Playwright, Flutter; a busy runner peaked at 6.0G.
[profiles.glowly]
image_stage = "glowly"
cpus = 8
memory = "7G"
slots = 2

[[repositories]]
name = "ayagmar/trellis"
profile = "trellis"
labels = ["self-hosted", "linux", "x64", "trellis"]

[[repositories]]
name = "ayagmar/glowly"
profile = "glowly"
labels = ["self-hosted", "linux", "x64", "glowly"]
