[workspace]
resolver = "3"
members = ["crates/core", "crates/daemon", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/ayagmar/runnerd"

[workspace.dependencies]
runnerd-core = { path = "crates/core", version = "0.1.0" }
bollard = { version = "0.21.1", default-features = false, features = ["pipe"] }
clap = { version = "4.6.7", features = ["derive"] }
futures-util = "0.3.34"
log = "0.4.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tar = { version = "0.4.46", default-features = false }
thiserror = "2.0.21"
tokio = "1.54.1"
toml = "1.1.8"

[workspace.lints.rust]
unsafe_code = "forbid"
