[workspace]
resolver = "3"
members = ["crates/core", "crates/daemon", "crates/cli", "crates/web"]

[workspace.package]
version = "0.0.5"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/ayagmar/runnerd"
readme = "README.md"

[workspace.dependencies]
runnerd-core = { path = "crates/core", version = "0.0.5", default-features = false }
runnerd-web = { path = "crates/web", version = "0.0.5" }
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "tokio"] }
bollard = { version = "0.21.1", default-features = false, features = ["pipe"] }
clap = { version = "4.6.7", features = ["derive"] }
futures-util = "0.3.34"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", default-features = false }
hyper-util = { version = "0.1.21", default-features = false }
log = "0.4.34"
# The terminal UI: the crossterm backend only; the calendar widget would pull in `time`.
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "layout-cache"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
# Bundled: SQLite is compiled in, so release binaries need no system libsqlite3. fallible_uint: u64 columns, which
# fail rather than wrap above i64::MAX.
rusqlite = { version = "0.40.2", features = ["bundled", "fallible_uint"] }
# Safe system calls: runnerctl tui stops itself on Ctrl-Z, and its tests drive it in a pseudo-terminal.
rustix = { version = "1.1.5", default-features = false, features = ["std"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_urlencoded = "0.7.1"
tar = { version = "0.4.46", default-features = false }
thiserror = "2.0.21"
tokio = "1.54.1"
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["ansi", "fmt", "std"] }
# Terminal cell widths, as ratatui measures them: runnerctl tui fits text to cells, not characters.
unicode-width = "0.2.2"

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"
missing_debug_implementations = "warn"
unused_qualifications = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that fight the codebase's style:
# Results and futures already warn when unused; #[must_use] on every getter adds noise and catches nothing.
must_use_candidate = "allow"
# Doc comments name the failure in their first line; an `# Errors` section per function would repeat it.
missing_errors_doc = "allow"
# An impl of an async trait method reads as `async fn` even when it awaits nothing, as fakes and extractors do.
unused_async_trait_impl = "allow"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
allow_attributes_without_reason = "warn"
large_futures = "warn"
await_holding_lock = "warn"

[profile.dist]
inherits = "release"
lto = "thin"

[workspace.metadata.dist]
cargo-dist-version = "0.33.1"
ci = "github"
# The shell installer is the hand-written install.sh (it runs runnerd doctor and takes --prefix). Add "npm" here once
# npm trusted publishing is set up for the release workflow.
installers = []
# release.yml is edited after generation; see its header.
allow-dirty = ["ci"]
targets = ["x86_64-unknown-linux-musl", "aarch64-unknown-linux-musl"]
pr-run-mode = "skip"
github-attestations = true

[workspace.metadata.dist.github-custom-runners]
global = "ubuntu-24.04"
x86_64-unknown-linux-musl = "ubuntu-24.04"
aarch64-unknown-linux-musl = "ubuntu-24.04-arm"

[workspace.metadata.dist.github-action-commits]
"actions/checkout" = "3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
"actions/upload-artifact" = "cf430e030ddbb5b0abf93d22962f4752f3646cd9" # v7.0.2
"actions/download-artifact" = "9000827ccba6bdab643e8b6fd33ac0654aef8333" # v8.0.2
"actions/attest" = "1e69f48acb82d1966a394da916b4c1698aa569d6" # v4.2.2
