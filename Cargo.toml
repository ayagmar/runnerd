[workspace]
resolver = "3"
members = ["crates/core", "crates/daemon", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/ayagmar/runnerd"

[workspace.dependencies]
runnerd-core = { path = "crates/core", version = "0.1.0" }
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
toml = "1.1.8"

[workspace.lints.rust]
unsafe_code = "forbid"
